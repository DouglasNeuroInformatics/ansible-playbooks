[defaults]
forks = 100
strategy = free

timeout = 30

log_path = ./logs/ansible.log

inventory = ./inventory

vault_password_file = ./.vault_pass
# inject_facts_as_vars = True

show_custom_stats = true
display_args_to_stdout = false

# callbacks_enabled = task_summary
callback_plugins = ./callback_plugins
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer, task_summary

# Skip fact gathering unless you need it (or use smart + caching below)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Faster callback / less overhead
interpreter_python = auto_silent

# Disable host key checking if your inventory churns (security tradeoff)
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60m -o PreferredAuthentications=publickey
control_path = /tmp/ansible-ssh-%%C
