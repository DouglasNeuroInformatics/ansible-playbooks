# Keep the user caches off the NFS home directories.
#
# pam_env runs for each type of login: an ssh login shell, `ssh host command`,
# scp, sftp, rsync, the VS Code remote server, the lightdm session, a console
# login, su and cron. A script in /etc/profile.d runs in a login shell only, so
# the variables are set here. See roles/common/tasks/xdg-cache.yml.
#
# @{PAM_USER} is the name of the user who logs in. pam_env reads the lines in
# order, so each line after the first can use ${XDG_CACHE_HOME}.
#
# pam_env always sets the DEFAULT value. It does not keep a value that is set
# already. To use a different path, a user must set it in ~/.profile, which runs
# later. A session with no login shell always uses the values in this file.
XDG_CACHE_HOME              DEFAULT=/var/tmp/xdgcache-@{PAM_USER}

# The lines below are only for tools that keep a cache in $HOME and ignore
# XDG_CACHE_HOME. Do not add a line for a tool that reads XDG_CACHE_HOME. These
# tools read it (paths from cichm01):
#   pip             $XDG_CACHE_HOME/pip         (`pip cache dir`)
#   uv              $XDG_CACHE_HOME/uv          (`uv cache dir`)
#   go build cache  $XDG_CACHE_HOME/go-build    (GOCACHE)
#   nvidia GL       $XDG_CACHE_HOME/nvidia/GLCache
#   ccache 4.x      $XDG_CACHE_HOME/ccache
#   huggingface     $XDG_CACHE_HOME/huggingface (HF_HOME)
#   torch           $XDG_CACHE_HOME/torch
#   matplotlib      $XDG_CACHE_HOME/matplotlib
#   mesa, fontconfig, R, gh, the browsers and other XDG programs
# The variable names come from the documentation of each tool and from
# https://github.com/b3nj5m1n/xdg-ninja. When a new tool writes a cache to
# $HOME, look in that list first.

# conda, mamba and micromamba: the package cache. `micromamba info` shows that
# micromamba also reads CONDA_PKGS_DIRS. The environments stay in $HOME,
# because they contain installed software, not cache data.
CONDA_PKGS_DIRS             DEFAULT=${XDG_CACHE_HOME}/.condapkg

# apptainer and singularity: the image cache.
APPTAINER_CACHEDIR          DEFAULT=${XDG_CACHE_HOME}/.apptainer
SINGULARITY_CACHEDIR        DEFAULT=${XDG_CACHE_HOME}/.singularity

# npm (also node-gyp) and yarn: the download cache. nvm keeps its node versions
# in $HOME/.nvm, because they are installed software.
NPM_CONFIG_CACHE            DEFAULT=${XDG_CACHE_HOME}/npm
YARN_CACHE_FOLDER           DEFAULT=${XDG_CACHE_HOME}/yarn

# go: GOCACHE uses XDG_CACHE_HOME, but the module cache uses GOPATH
# ($HOME/go/pkg/mod).
GOMODCACHE                  DEFAULT=${XDG_CACHE_HOME}/go/mod

# setuptools: the egg cache, $HOME/.python-eggs.
PYTHON_EGG_CACHE            DEFAULT=${XDG_CACHE_HOME}/python-eggs

# MATLAB Runtime: without this variable, it writes $HOME/.mcrCache* each time it
# starts.
MCR_CACHE_ROOT              DEFAULT=${XDG_CACHE_HOME}/mcr

# nvidia: the CUDA cache uses $HOME/.nv/ComputeCache, which exists on the NFS
# homes now. The current driver puts the GL cache in XDG_CACHE_HOME. The second
# line is for older drivers, which use $HOME/.nv/GLCache.
CUDA_CACHE_PATH             DEFAULT=${XDG_CACHE_HOME}/nv/ComputeCache
__GL_SHADER_DISK_CACHE_PATH DEFAULT=${XDG_CACHE_HOME}/nv/GLCache

# triton, the GPU kernel compiler of pytorch: $HOME/.triton.
TRITON_HOME                 DEFAULT=${XDG_CACHE_HOME}/triton

# CuPy: the compiled GPU kernels, $HOME/.cupy/kernel_cache.
CUPY_CACHE_DIR              DEFAULT=${XDG_CACHE_HOME}/cupy

# libX11: the compose table cache, $HOME/.compose-cache. X programs write it
# when they start.
XCOMPOSECACHE               DEFAULT=${XDG_CACHE_HOME}/X11/xcompose

# texlive: the generated formats and font caches, $HOME/.texlive*/texmf-var.
TEXMFVAR                    DEFAULT=${XDG_CACHE_HOME}/texlive/texmf-var

# starship: it writes $HOME/.cache/starship, even when XDG_CACHE_HOME is set.
STARSHIP_CACHE              DEFAULT=${XDG_CACHE_HOME}/starship
