# Keep the user caches off the NFS $HOME.
#
# pam_env is the only hook that every login type passes through: an ssh login
# shell, `ssh host command`, scp, sftp, rsync, the VS Code remote server, the
# lightdm session, a console login, su and cron. /etc/profile.d reaches login
# shells only, so the variables live here and files/xdg.cache.sh makes the
# directories. See roles/common/tasks/xdg-cache.yml.
#
# @{PAM_USER} is the name of the user who logs in. pam_env reads the lines in
# order, which is why ${XDG_CACHE_HOME} is available to the lines after the
# first one. pam_env writes the DEFAULT value into each session: a user who
# wants another path must set it in ~/.profile, which runs after this, and a
# non-login session keeps the value below.
XDG_CACHE_HOME              DEFAULT=/var/tmp/xdgcache-@{PAM_USER}

# The lines below are only for the tools that keep a cache in $HOME and do not
# read XDG_CACHE_HOME. Do not add a line for a tool that reads it, because the
# line above is then enough. These paths come from the tools on cichm01:
#   pip             $XDG_CACHE_HOME/pip         (`pip cache dir`)
#   uv              $XDG_CACHE_HOME/uv          (`uv cache dir`)
#   go build cache  $XDG_CACHE_HOME/go-build    (GOCACHE)
#   nvidia GL       $XDG_CACHE_HOME/nvidia/GLCache
#   ccache 4.x      $XDG_CACHE_HOME/ccache
#   huggingface     $XDG_CACHE_HOME/huggingface (HF_HOME)
#   torch           $XDG_CACHE_HOME/torch
#   matplotlib      $XDG_CACHE_HOME/matplotlib
#   mesa, fontconfig, R, gh, the browsers, and the other XDG programs
# The names of the variables below come from the tools and from the list at
# https://github.com/b3nj5m1n/xdg-ninja -- look there first when a new tool
# writes to $HOME.

# conda and mamba. micromamba reads CONDA_PKGS_DIRS as well: `micromamba info`
# shows the package cache below. The environments stay in $HOME, because they
# are installed software, not a cache.
CONDA_PKGS_DIRS             DEFAULT=${XDG_CACHE_HOME}/.condapkg

# Containers
APPTAINER_CACHEDIR          DEFAULT=${XDG_CACHE_HOME}/.apptainer
SINGULARITY_CACHEDIR        DEFAULT=${XDG_CACHE_HOME}/.singularity

# node: npm, node-gyp and yarn keep the download cache in $HOME. The node
# versions of nvm stay in $HOME/.nvm, because they are installed software.
NPM_CONFIG_CACHE            DEFAULT=${XDG_CACHE_HOME}/npm
YARN_CACHE_FOLDER           DEFAULT=${XDG_CACHE_HOME}/yarn

# go: GOCACHE follows XDG_CACHE_HOME, but the module cache follows GOPATH.
GOMODCACHE                  DEFAULT=${XDG_CACHE_HOME}/go/mod

# python: the egg cache of setuptools writes $HOME/.python-eggs.
PYTHON_EGG_CACHE            DEFAULT=${XDG_CACHE_HOME}/python-eggs

# MATLAB Runtime. Without this it writes to $HOME/.mcrCache* at each start.
MCR_CACHE_ROOT              DEFAULT=${XDG_CACHE_HOME}/mcr

# nvidia: the CUDA cache writes $HOME/.nv/ComputeCache, which is on this NFS
# home now. The GL cache already follows XDG_CACHE_HOME, and the line below
# also covers an older driver that uses $HOME/.nv/GLCache.
CUDA_CACHE_PATH             DEFAULT=${XDG_CACHE_HOME}/nv/ComputeCache
__GL_SHADER_DISK_CACHE_PATH DEFAULT=${XDG_CACHE_HOME}/nv/GLCache

# triton, the GPU kernel compiler of pytorch: $HOME/.triton
TRITON_HOME                 DEFAULT=${XDG_CACHE_HOME}/triton

# X11 input: libX11 writes the compose table cache to $HOME/.compose-cache at
# each start of a program.
XCOMPOSECACHE               DEFAULT=${XDG_CACHE_HOME}/X11/xcompose

# texlive makes the formats and the font cache again in $HOME/.texlive*
TEXMFVAR                    DEFAULT=${XDG_CACHE_HOME}/texlive/texmf-var

# starship writes $HOME/.cache/starship, also when XDG_CACHE_HOME is set.
STARSHIP_CACHE              DEFAULT=${XDG_CACHE_HOME}/starship
