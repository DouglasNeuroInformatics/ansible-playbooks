# Keep every clean-up with an age away from the user caches in /var/tmp.
#
# No host has a /var/tmp rule now: Ubuntu ships `#q /var/tmp 1777 root root
# 30d` as a comment in /usr/lib/tmpfiles.d/tmp.conf, and the hosts have no
# tmpreaper. If such a rule becomes active, from an update, a drop-in or by
# hand, the daily systemd-tmpfiles-clean.service removes single files by age
# from inside a cache that is in use. That makes a cache bad, not empty: a go
# module cache then stops a build with a checksum error, an npm cache needs
# `npm cache verify`, and a conda package directory without its info/ confuses
# the solver.
#
# An `x` line keeps a path and its content out of every clean-up with an age.
# It does not change an `r` or an `R` line, and it does not change
# /usr/local/sbin/xdgcache-reap, which removes a full directory.
x /var/tmp/xdgcache-*
