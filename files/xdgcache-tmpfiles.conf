# Make the cache directory that pam_env sets, with mode 0700. The user instance
# of systemd reads this file when it starts, at the first session of the user on
# the host. This includes a session with no login shell. %u is the user name.
#
# A `d` line also sets mode 0700 on a directory that already exists.
#
# The age field is empty on purpose. An age-based cleanup removes single files
# from a cache that is in use, and the cache then becomes corrupt.
d /var/tmp/xdgcache-%u 0700 - - -
