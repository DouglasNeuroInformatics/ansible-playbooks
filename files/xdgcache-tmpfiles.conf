# Make the cache directory that pam_env points at, with mode 0700. The user
# instance of systemd runs this at the start of each logind session, which
# includes a session that reads no profile. %u is the name of the user.
#
# The age field stays empty on purpose: an age rule removes single files from a
# cache that is in use and makes it bad.
d /var/tmp/xdgcache-%u 0700 - - -
