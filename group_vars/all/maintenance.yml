---
# Shared by update.yml, roles/workstation/tasks/nvidia.yml and the hold task in
# roles/common. All of them gate kernel/driver changes on the checks below, and
# update.yml and the workstation role had already drifted apart once (different
# hold lists), so the definitions live here in one place.

# Counts real interactive users, excluding the Ansible executor.
#
# Deliberately not `who`: that reads utmp, which gets no entry for an SSH
# session without a PTY -- rsync, sshfs, VS Code Remote, plain `ssh host cmd`.
# A user working over such a session counted as zero, so the host looked idle
# and the nvidia driver could be swapped out from under them. Verified on
# dnpws07, where `who` saw nobody while two State=active sshd sessions with an
# empty TTY belonged to a real user.
#
# Excluded: greeter sessions (lightdm/sddm run as their own users) and stale
# State=closing sessions, some of which linger for months and would otherwise
# make an idle host look permanently busy.
logged_in_users_command: |
  loginctl list-sessions --no-legend | awk '{print $1}' | while read -r s; do
    loginctl show-session "$s" -p Name -p Class -p State | paste -sd' '
  done | grep 'Class=user' | grep -E 'State=(active|online)' \
    | sed 's/.*Name=\([^ ]*\).*/\1/' | grep -vx localadmin | sort -u | wc -l

# Counts running Slurm job steps on this node.
#
# The pattern matters: every node runs a persistent `/usr/sbin/slurmstepd
# infinity` helper whether or not any job is present, so a plain
# `pgrep slurmstepd` matches on all 59 nodes and would block reboots forever.
# Real job steps appear as `slurmstepd: [<jobid>.extern]` / `[<jobid>.batch]`,
# which is what the bracket anchors on. Verified against squeue on both busy
# and idle nodes.
#
# Checked locally rather than with squeue so that an unreachable controller
# cannot make a busy node look idle -- and because one node has no squeue.
slurm_jobs_command: |
  pgrep -f 'slurmstepd: \[' 2>/dev/null | wc -l

# Both gates together. Workstations run slurmd too, so a driver swap under a
# running GPU job breaks it just as surely as one under a logged-in user.
host_idle: >-
  {{ (logged_in_users_count.stdout | int == 0)
     and (slurm_jobs_count.stdout | int == 0) }}

# -e force_maintenance=true runs the kernel and nvidia changes on a busy host,
# e.g. cichm01, where your own session always counts as a user. It does not
# force the reboot: after a forced driver change, CUDA and nvidia-smi fail with
# "Driver/library version mismatch" until the host reboots. For that, add
# -e force_reboot=true (update.yml), which reboots with users or jobs on it.
maintenance_window: >-
  {{ (force_maintenance | default(false) | bool) or (host_idle | bool) }}

# Held so a routine apt upgrade cannot swap a kernel or driver out from under a
# running session; released only inside the maintenance window, and put back
# even when the maintenance fails. Keep in step with Package-Blacklist in
# roles/common/templates/50unattended-upgrades.j2.
#
# Only the kernel metapackages: every new kernel has a new package name that
# only the metapackage pulls in. Not 'linux-*' -- a glob that wide holds every
# uninstalled flavour in the cache (hundreds of stale holds on cichm01).
held_kernel_patterns:
  - 'linux-zabbly'
  - 'linux-generic*'
  - 'linux-image-generic*'
  - 'linux-headers-generic*'
held_nvidia_patterns:
  - '*nvidia*'
held_package_patterns: >-
  {{ held_kernel_patterns
     + (held_nvidia_patterns if 'workstations' in group_names else []) }}

# The driver branch for every GPU workstation, from the xanmod repo (see
# roles/workstation/tasks/repos.yml). Change this to move the workstations to a
# new branch; update.yml and site.yml both act on it. update.yml also takes
# point releases inside the branch, site.yml only installs it where missing.
nvidia_version: nvidia-driver-595-open
bad_nvidia_version: nvidia-driver-390
