---
# A role of its own purely for ordering: roles run in the order site.yml lists
# them, so this is the only way to guarantee the proxy exists before anything
# reaches apt. It previously lived in common/file-config.yml, which runs after
# repos.yml, packages.yml and the manual debs -- so on a fresh host every one
# of those fetched directly, bypassing the cache entirely. mambaorg.micromamba
# also runs before common and uses ansible.builtin.package, so putting it first
# inside common would still have been too late.
- name: enable apt proxy
  template: src=99proxy.j2 dest=/etc/apt/apt.conf.d/99proxy

# Here for the same ordering reason as the proxy above: no use bounding apt's
# timeouts only after the first three roles have already fetched everything.
- name: bound apt network timeouts
  copy:
    src: 99-timeouts
    dest: /etc/apt/apt.conf.d/99-timeouts
    owner: root
    group: root
    mode: "0644"

# The idle timeout in 99-timeouts did not stop an `apt-get update` on cicws44
# that waited on half-closed connections for 24 days, holding the apt lock the
# whole time. Only the list refresh: stopping apt-daily-upgrade could kill dpkg
# in the middle of a configure.
- name: bound apt-daily run time
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily.service.d
    state: directory
    mode: "0755"

- name: bound apt-daily run time
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily.service.d/timeout.conf
    content: |
      # Deployed by ansible (roles/apt-proxy).
      [Service]
      TimeoutStartSec=2h
    owner: root
    group: root
    mode: "0644"
  register: apt_daily_timeout

- name: reload systemd for the apt-daily limit
  ansible.builtin.systemd:
    daemon_reload: true
  when: apt_daily_timeout is changed
