# Debian's fd-find declares Conflicts: with the upstream fd deb below, so that
# install failed on every host still carrying it -- and ignore_errors hid the
# failure. Note this drops the /usr/bin/fdfind name; upstream ships /usr/bin/fd.
- name: Remove packages conflicting with the manual debs
  ansible.builtin.apt:
    name: fd-find
    state: absent

- name: Install Manual Deb Files
  apt: deb={{ item }}
  with_items:
    - https://github.com/sharkdp/bat/releases/download/v0.26.1/bat_0.26.1_amd64.deb
    - https://github.com/twpayne/chezmoi/releases/download/v2.72.0/chezmoi_2.72.0_linux_amd64.deb
    - https://github.com/bootandy/dust/releases/download/v1.2.4/du-dust_1.2.4-1_amd64.deb
    - https://github.com/lsd-rs/lsd/releases/download/v1.2.0/lsd_1.2.0_amd64_xz.deb
    - https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep_15.2.0-1_amd64.deb
    - https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.deb
    - https://github.com/kellyjonbrazil/jc/releases/download/v1.25.7/jc_1.25.7-2_amd64.deb
    - https://github.com/sharkdp/fd/releases/download/v10.4.2/fd_10.4.2_amd64.deb
  ignore_errors: yes
