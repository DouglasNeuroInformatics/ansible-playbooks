
#Pipx packages
- import_tasks: pipx-bootstrap.yml

- name: ensure /opt/pipx
  ansible.builtin.file:
    path: /opt/pipx
    state: directory
    mode: 0755

- name: install pipx packages
  community.general.pipx:
    name: "{{ item }}"
    state: present
    executable: "{{ pipx_executable }}"
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  with_items:
    - rsyncy
    - pipenv
    - globus-cli
    - visidata
    - awscli
    - datalad
    - uv
