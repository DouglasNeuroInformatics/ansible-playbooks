- name: Ensure https transport prerequisites
  ansible.builtin.apt:
    name: ca-certificates
    state: present

# Each stanza is keyed on its own Suites line, not on the URI.
#
# Anchoring on the URI ('^URIs:.*archive') only ever matched the stock Ubuntu
# URLs, so the task was a one-shot: once a host had been pointed at a mirror it
# could never be corrected again. Rewriting every URIs: line instead was worse
# -- it pointed noble-security at the archive mirror too, which broke security
# updates fleet-wide. Keying on Suites: is idempotent and keeps the two stanzas
# independent, so this also repairs hosts already in that state.
#
# Relies on URIs: being immediately followed by Suites:, which holds for the
# stock deb822 layout and was verified across every host in the fleet.
- name: Set ubuntu archive mirror in ubuntu.sources
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: '^URIs:.*\n(Suites:(?!.*-security).*)$'
    replace: 'URIs: {{ ubuntu_mirror_uri }}\n\1'

- name: Set ubuntu security source in ubuntu.sources
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: '^URIs:.*\n(Suites:.*-security.*)$'
    replace: 'URIs: {{ ubuntu_security_uri }}\n\1'

- name: disable ubuntu pro messages
  command: pro config set apt_news=false
  ignore_errors: true

- name: Remove esm spam
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/20apt-esm-hook.conf
    state: absent

- name: Remove old keyfile
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg
    state: absent

# creates: keeps this from re-running once the PPA exists. Without it,
# apt-add-repository would not recognise the http:// entry the apt-cache pass
# leaves behind and would add a duplicate https:// stanza on every run.
- name: add ppa repos
  command:
    cmd: apt-add-repository -y -n {{ item }}
    creates: "/etc/apt/sources.list.d/{{ item | replace('ppa:', '') | replace('.', '_') | replace('/', '-ubuntu-') }}-{{ ansible_distribution_release }}.sources"
  with_items:
    - ppa:git-core/ppa
    - ppa:apptainer/ppa
    - ppa:rapier1/hpnssh
    - ppa:ansible/ansible
    - ppa:fish-shell/release-4
    - ppa:neovim-ppa/stable

# Dropping a PPA from the list above does not remove it from hosts that already
# have it, so retired ones are deleted explicitly. apt-fast published nothing
# for noble -- apt-add-repository left the entry behind without ever creating a
# usable repo.
- name: remove retired ppa repos
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item | replace('ppa:', '') | replace('.', '_') | replace('/', '-ubuntu-') }}-{{ ansible_distribution_release }}.sources"
    state: absent
  with_items:
    - ppa:apt-fast/stable
    - ppa:fish-shell/release-3   # superseded by release-4 above

- name: Add docker repo
  deb822_repository:
    name: docker
    types: deb
    uris: http://download.docker.com/linux/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Add zabbly repo
  deb822_repository:
    name: zabbly
    types: deb
    uris: http://pkgs.zabbly.com/kernel/stable
    suites: '{{ ansible_distribution_release }}'
    components: main
    architectures: amd64
    signed_by: https://pkgs.zabbly.com/key.asc

- name: Add cmake repo
  deb822_repository:
    name: cmake
    types: deb
    uris: http://apt.kitware.com/ubuntu/
    suites: '{{ ansible_distribution_release }}'
    components: main
    architectures: amd64
    signed_by: https://apt.kitware.com/keys/kitware-archive-latest.asc

# The xanmod repo is for the nvidia driver, which only workstations get (see
# roles/workstation/tasks/repos.yml). Compute nodes had it from this role, and
# with Origins-Pattern "o=*" unattended-upgrades would install from it.
- name: remove xanmod repo from non-workstations
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/xanmod.sources
    state: absent
  when: "'workstations' not in group_names"

# Non-PPA counterpart to the retired-ppa tasks above; see
# group_vars/all/repo-cleanup.yml for what is deliberately left in place.
# Runs before the sweep below so removed files are not picked up by it.
- name: remove stale repo files
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/{{ item }}
    state: absent
  loop: '{{ stale_repo_files }}'
  when: inventory_hostname not in repo_cleanup_exempt_hosts

# Two passes over every source file, including ones these roles do not own:
# vendor .list files dropped by .deb postinst (cuda, tailscale, zerotier...),
# hand-added sources, and PPAs written by apt-add-repository.
#
# Pass 1 makes https the default, skipping the repos acng caches -- acng needs
# to read the request to cache it, and it re-fetches those upstream over https
# itself. Pass 2 then forces those cached repos down to http. A repo we do not
# cache therefore never ends up plaintext on the public internet.
#
# The lookahead in pass 1 is what keeps this idempotent: without it pass 1 and
# pass 2 flip the same lines back and forth and every cached repo reports
# changed on every run.
- name: Find apt source files
  ansible.builtin.find:
    paths:
      - /etc/apt
      - /etc/apt/sources.list.d
    patterns:
      - '*.list'
      - '*.sources'
  register: apt_source_files

- name: Force https on deb822 sources
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '^(URIs:\s*)http://(?!(?:{{ apt_cached_repos | map(attribute="url") | map("regex_escape") | join("|") }}))'
    replace: '\1https://'
  loop: '{{ apt_source_files.files }}'
  loop_control:
    label: '{{ item.path }}'

- name: Force https on one-line sources
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '^(deb(?:-src)?\s+(?:\[[^]]*\]\s+)?)http://(?!(?:{{ apt_cached_repos | map(attribute="url") | map("regex_escape") | join("|") }}))'
    replace: '\1https://'
  loop: '{{ apt_source_files.files }}'
  loop_control:
    label: '{{ item.path }}'

- name: Route cached repos through the apt cache in deb822 sources
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '^(URIs:\s*)https://({{ apt_cached_repos | map(attribute="url") | map("regex_escape") | join("|") }})'
    replace: '\1http://\2'
  loop: '{{ apt_source_files.files }}'
  loop_control:
    label: '{{ item.path }}'

- name: Route cached repos through the apt cache in one-line sources
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '^(deb(?:-src)?\s+(?:\[[^]]*\]\s+)?)https://({{ apt_cached_repos | map(attribute="url") | map("regex_escape") | join("|") }})'
    replace: '\1http://\2'
  loop: '{{ apt_source_files.files }}'
  loop_control:
    label: '{{ item.path }}'
