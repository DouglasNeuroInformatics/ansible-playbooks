# The GECOS is the display name on anything still mailed as bare root, so it
# carries the same address the From: header does. See group_vars/all/mail.yml.
- name: Update root user GECOS field for email readability
  ansible.builtin.user:
    name: root
    comment: "root@{{ mail_host }}"

# regexp so the address is replaced in place. Without it lineinfile only ever
# appends, and the old @douglas.mcgill.ca line stays in the file forever --
# sudo honours the last mailfrom it reads, but the stale line is confusing and
# one reordering away from being the live one.
- name: configure sudo email address
  lineinfile:
    path: /etc/sudoers.d/99-sudoers-config
    create: yes
    regexp: '^Defaults\s+mailfrom='
    line: "Defaults mailfrom=\"sudo@{{ mail_host }}\""
    validate: 'visudo -cf %s'

- name: add cicadministrators to sudoers
  lineinfile:
    path: /etc/sudoers.d/99-sudoers-config
    line: "%cicadministrators ALL=(ALL) NOPASSWD:ALL"
    validate: 'visudo -cf %s'

- name: apply settings to bash history
  copy: src=files/bash_history_timestamp.sh dest=/etc/profile.d/

- name: Block algif_aead from being loaded (mitigation for CVE-2026-31431)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/disable-algif-aead.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Mitigation for CVE-2026-31431 ("Copy Fail")
      install algif_aead /bin/false
  tags:
    - security

- name: Unload algif_aead if currently loaded
  ansible.builtin.command: rmmod algif_aead
  register: rmmod_algif_aead
  changed_when: rmmod_algif_aead.rc == 0
  failed_when: false
  tags:
    - security
