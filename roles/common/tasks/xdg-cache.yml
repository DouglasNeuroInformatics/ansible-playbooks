---
# Keep the user caches off the NFS home directories.
#
# A script in /etc/profile.d runs in a login shell only. `ssh host command`,
# scp, sftp, rsync, the VS Code remote server and cron start no login shell, so
# they wrote their caches to the NFS home. pam_env runs for each of these
# services (sshd, hpnsshd, login, su, cron, sudo and lightdm). This file sets
# the variables through pam_env, and the common role installs them on the
# workstations and the compute nodes.

- name: Redirect the user caches with pam_env
  ansible.builtin.blockinfile:
    path: /etc/security/pam_env.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- xdg cache"
    block: "{{ lookup('file', 'files/pam_env_xdg_cache.conf') }}"
    owner: root
    group: root
    mode: '0644'

# pam_env sets the variables, but it does not make the directory. The user
# instance of systemd makes it: it runs systemd-tmpfiles when it starts, at the
# first session of a user on the host. This includes a session with no login
# shell.
#
# In --user mode, systemd-tmpfiles reads its configuration from the XDG
# directories. It does not read /etc/user-tmpfiles.d. On cichm01,
# `SYSTEMD_LOG_LEVEL=debug systemd-tmpfiles --user --create` shows this order:
#   /etc/xdg/user-tmpfiles.d
#   ~/.config/user-tmpfiles.d
#   $XDG_RUNTIME_DIR/user-tmpfiles.d
#   ~/.local/share/user-tmpfiles.d
#   <entry>/user-tmpfiles.d for each entry in XDG_DATA_DIRS
# /etc/xdg/user-tmpfiles.d is first, and it is the location for local
# administrator configuration.
- name: Create the user tmpfiles directory
  ansible.builtin.file:
    path: /etc/xdg/user-tmpfiles.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the rule that makes the cache directory
  ansible.builtin.copy:
    src: files/xdgcache-tmpfiles.conf
    dest: /etc/xdg/user-tmpfiles.d/xdgcache.conf
    owner: root
    group: root
    mode: '0644'

# The preset of the user instance enables systemd-tmpfiles-setup.service, but
# the link in basic.target.wants does not exist, so the service does not start.
# The next two tasks make the link that `systemctl --global enable` makes. A
# file task is idempotent; the command is not.
- name: Create the user basic.target.wants directory
  ansible.builtin.file:
    path: /etc/systemd/user/basic.target.wants
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Enable the user tmpfiles service for every user
  ansible.builtin.file:
    src: /usr/lib/systemd/user/systemd-tmpfiles-setup.service
    dest: /etc/systemd/user/basic.target.wants/systemd-tmpfiles-setup.service
    state: link
    force: true

# No job cleans /var/tmp. Ubuntu ships the `q /var/tmp ... 30d` rule as a
# comment, and the hosts do not have tmpreaper. The next five tasks manage the
# caches in /var/tmp:
#   - The exclude rule stops every age-based cleanup of the caches. An
#     age-based cleanup removes single files from a cache that is in use, and
#     the cache then becomes corrupt.
#   - The reaper limits the growth. It removes full directories only.
- name: Exclude the caches from age-based cleanup
  ansible.builtin.copy:
    src: files/xdgcache-exclude.conf
    dest: /etc/tmpfiles.d/xdgcache-exclude.conf
    owner: root
    group: root
    mode: '0644'

- name: Install the cache reaper
  ansible.builtin.copy:
    src: files/xdgcache-reap.sh
    dest: /usr/local/sbin/xdgcache-reap
    owner: root
    group: root
    mode: '0755'

- name: Install the cache reaper service
  ansible.builtin.copy:
    src: files/xdgcache-reap.service
    dest: /etc/systemd/system/xdgcache-reap.service
    owner: root
    group: root
    mode: '0644'

- name: Install the cache reaper timer
  ansible.builtin.copy:
    src: files/xdgcache-reap.timer
    dest: /etc/systemd/system/xdgcache-reap.timer
    owner: root
    group: root
    mode: '0644'

# Give the full unit name, with .timer. Without the suffix, the systemd module
# uses the service, and the timer does not start.
- name: Enable the cache reaper timer
  ansible.builtin.systemd:
    name: xdgcache-reap.timer
    state: started
    enabled: true
    daemon_reload: true

# Login shells also run files/xdg.cache.sh. It examines the cache directory,
# makes the cache directory of each tool, and sets the flatpak path.
- name: Install the cache script for login shells
  ansible.builtin.copy:
    src: files/xdg.cache.sh
    dest: /etc/profile.d/xdg.cache.sh
    owner: root
    group: root
    mode: '0644'
