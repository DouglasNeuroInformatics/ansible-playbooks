---
# Runs after nvidia-driver.yml and the kernel install; see nvidia-driver.yml
# for the order. Checks that the kernel GRUB will boot has the nvidia module,
# and takes that kernel back out when it does not. Hosts with no nvidia driver
# (nvidia_target '': no GPU, or nouveau) skip the module checks.

- name: Rebuild all dkms packages
  ansible.builtin.shell: |
    ls /boot/initrd.img-* | cut -d- -f2- | xargs -n1 /usr/lib/dkms/dkms_autoinstaller start
  when:
    - nvidia_target | length > 0
    - (nvidia_installed.changed | default(false)) or (kernel_installed.changed | default(false))

# GRUB boots the newest kernel by default, so that is the one that must have
# the module. dkms_autoinstaller does not fail when a build fails.
- name: Find newest kernel
  ansible.builtin.shell: linux-version list | linux-version sort | tail -1
  register: newest_kernel
  changed_when: false  # This task never changes system state
  check_mode: false    # read-only, and the checks below depend on it
  when: nvidia_target | length > 0

- name: Verify nvidia module for newest kernel
  ansible.builtin.command: modinfo -k {{ newest_kernel.stdout | quote }} nvidia
  register: nvidia_module
  failed_when: false
  changed_when: false  # This task never changes system state
  check_mode: false    # read-only, and the checks below depend on it
  when: nvidia_target | length > 0

# Never the running kernel. Any other kernel is safe to remove, including one
# an earlier run installed that the host has not booted yet. Removing the image
# also takes the linux-zabbly metapackage with it; the holds are already
# released by the caller.
- name: Find package of the new kernel
  ansible.builtin.command: dpkg-query -S /boot/vmlinuz-{{ newest_kernel.stdout }}
  register: newest_kernel_package
  changed_when: false  # This task never changes system state
  check_mode: false
  when:
    - nvidia_target | length > 0
    - nvidia_module.rc != 0
    - newest_kernel.stdout != ansible_kernel

- name: Remove the new kernel
  ansible.builtin.apt:
    name:
      - "{{ newest_kernel_package.stdout.split(':')[0] }}"
      - "linux-headers-{{ newest_kernel.stdout }}"
      - "linux-modules-{{ newest_kernel.stdout }}"
    state: absent
    purge: true
  register: newest_kernel_removed
  when: newest_kernel_package is not skipped

- name: Stop on a broken nvidia module
  ansible.builtin.fail:
    msg: >-
      No nvidia module for kernel {{ newest_kernel.stdout }} with
      {{ nvidia_target }}.
      {{ 'Removed that kernel; the host stays on ' ~ ansible_kernel ~ '.'
         if newest_kernel_removed is not skipped
         else 'It is the running kernel, so it was not removed. Repair by hand before the next reboot.' }}
  when:
    - nvidia_target | length > 0
    - nvidia_module.rc != 0

# After the rollback above, so a kernel that failed in the nvidia DKMS hook is
# already removed. Also covers hosts with no GPU, and any other apt failure.
- name: Stop on a failed kernel install
  ansible.builtin.fail:
    msg: >-
      The kernel install failed: {{ kernel_installed.msg | default('') }}
  when: kernel_installed is failed
