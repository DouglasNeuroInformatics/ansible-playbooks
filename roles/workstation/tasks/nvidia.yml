---
# See group_vars/all/maintenance.yml for why this is not `who`.
- name: Get logged-in users (excluding Ansible executor) count
  ansible.builtin.shell: '{{ logged_in_users_command }}'
  register: logged_in_users_count
  changed_when: false  # This task never changes system state
  check_mode: false    # read-only, and the gate below depends on it

# See group_vars/all/maintenance.yml -- do not simplify to `pgrep slurmstepd`.
- name: Count running slurm job steps
  ansible.builtin.shell: '{{ slurm_jobs_command }}'
  register: slurm_jobs_count
  changed_when: false  # This task never changes system state
  check_mode: false    # read-only, and the gate below depends on it

# Same structure as update.yml. The hold in always: has no gate, so it also
# puts back holds that an earlier failed or interrupted run left released.
# Imports, not includes, so the nvidia tag reaches the tasks inside.
- name: Nvidia driver and kernel
  block:
    - name: Nvidia driver and kernel in the maintenance window
      when: maintenance_window | bool
      block:
        - ansible.builtin.import_role:
            name: common
            tasks_from: apt-hold
          vars:
            apt_hold_action: unhold

        - ansible.builtin.import_tasks: nvidia-driver.yml

        - ansible.builtin.import_role:
            name: common
            tasks_from: kernel
          vars:
            kernel_rollback: true

        - ansible.builtin.import_tasks: nvidia-verify.yml
  always:
    - ansible.builtin.import_role:
        name: common
        tasks_from: apt-hold
      vars:
        apt_hold_action: hold
