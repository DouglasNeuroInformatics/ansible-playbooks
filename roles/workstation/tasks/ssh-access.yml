---
# per-host SSH access restriction.
#
# For any host that appears as a key in the `sshrestrict` dictionary
# (see group_vars/workstations/ssh_access.yml) we render an sshd_config.d
# drop-in. A host is either user-based (`users:`) or group-based (`groups:`);
# group-based hosts let sshd resolve membership live at each login. Hosts that
# are not listed have any previously-deployed policy removed.

- name: Ensure sshd_config.d exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in sshrestrict

- name: Ensure each restricted host defines exactly one non-empty users or groups list
  ansible.builtin.assert:
    that:
      - _entry is mapping
      - not (_entry.users is defined and _entry.groups is defined)
      - _entry.users is defined or _entry.groups is defined
      - (_entry.users | default(_entry.groups)) | length > 0
    fail_msg: >
      {{ inventory_hostname }} must define exactly one of `users` or `groups`, with at
      least one entry in it. sshd combines AllowUsers and AllowGroups with AND, so both
      together lock everyone out; neither (or an empty list) renders a policy that allows
      only the management defaults, which locks out every real user on the host.
  vars:
    _entry: "{{ sshrestrict[inventory_hostname] }}"
  when: inventory_hostname in sshrestrict

- name: Check whether sshd_config includes sshd_config.d
  ansible.builtin.command: >
    grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/\*\.conf'
    /etc/ssh/sshd_config
  register: sshd_include_check
  changed_when: false
  failed_when: sshd_include_check.rc not in [0, 1]
  check_mode: false
  when: inventory_hostname in sshrestrict

- name: Add Include for sshd_config.d if missing
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    insertafter: BOF
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    owner: root
    group: root
    mode: "0644"
  when:
    - inventory_hostname in sshrestrict
    - sshd_include_check.rc == 1
  notify: Validate and reload ssh

# --- Lockout safety for group-based hosts ---------------------------------
- name: Confirm allowed SSH groups exist
  ansible.builtin.command: "getent group {{ item }}"
  loop: "{{ (sshrestrict[inventory_hostname].groups | default([])) + (ssh_restrict_default_groups | default([])) }}"
  changed_when: false
  check_mode: false
  when:
    - inventory_hostname in sshrestrict
    - sshrestrict[inventory_hostname].groups is defined

- name: Look up the Ansible SSH user's groups
  ansible.builtin.command: "id -nG {{ ansible_ssh_user }}"
  register: ansible_user_groups
  changed_when: false
  check_mode: false
  when:
    - inventory_hostname in sshrestrict
    - sshrestrict[inventory_hostname].groups is defined

- name: Refuse to apply policy if the Ansible SSH user would be locked out (group-based)
  ansible.builtin.assert:
    that:
      - ansible_user_groups.stdout.split() | intersect((sshrestrict[inventory_hostname].groups | default([])) + (ssh_restrict_default_groups | default([]))) | length > 0
    fail_msg: >
      Refusing to apply SSH access policy: the Ansible SSH user {{ ansible_ssh_user }}
      is not a member of any allowed group on {{ inventory_hostname }}
      ({{ ((sshrestrict[inventory_hostname].groups | default([])) + (ssh_restrict_default_groups | default([]))) | join(', ') }}).
  when:
    - inventory_hostname in sshrestrict
    - sshrestrict[inventory_hostname].groups is defined

# --- Lockout safety for user-based hosts ----------------------------------
- name: Confirm allowed SSH users exist
  ansible.builtin.command: "getent passwd {{ item }}"
  loop: "{{ (sshrestrict[inventory_hostname].users | default([])) + (ssh_restrict_default_users | default([])) }}"
  changed_when: false
  check_mode: false
  when:
    - inventory_hostname in sshrestrict
    - sshrestrict[inventory_hostname].groups is not defined

- name: Refuse to apply policy if the Ansible SSH user would be locked out (user-based)
  ansible.builtin.assert:
    that:
      - ansible_ssh_user in ((sshrestrict[inventory_hostname].users | default([])) + (ssh_restrict_default_users | default([])))
    fail_msg: >
      Refusing to apply SSH access policy: the Ansible SSH user {{ ansible_ssh_user }}
      is not in the allowed users for {{ inventory_hostname }}. Add it to
      ssh_restrict_default_users or the host's users list.
  when:
    - inventory_hostname in sshrestrict
    - sshrestrict[inventory_hostname].groups is not defined

- name: Install per-host SSH access policy
  ansible.builtin.template:
    src: 50-ssh-access.conf.j2
    dest: "{{ ssh_access_policy_file | default('/etc/ssh/sshd_config.d/50-ssh-access-policy.conf') }}"
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in sshrestrict
  notify: Validate and reload ssh

- name: Remove SSH access policy from unlisted hosts
  ansible.builtin.file:
    path: "{{ ssh_access_policy_file | default('/etc/ssh/sshd_config.d/50-ssh-access-policy.conf') }}"
    state: absent
  when: inventory_hostname not in sshrestrict
  notify: Validate and reload ssh
