---
- hosts:
  - workstations
  - computenodes
  vars_files:
    - vars/kernel-nvidia.yml
  vars:
    # The reboot gate, named so the firmware update cannot drift from it. fwupd
    # stages most payloads for the bootloader to apply on the next boot, so it
    # is only worth running when that boot is actually going to happen. Lazily
    # evaluated, so it is only valid after the registers below have all run.
    reboot_pending: >-
      {{ (not (logged_in_users_count.stdout | int > 0))
         and (slurm_jobs_count.stdout | int == 0)
         and ((nvidia_installed.changed | default(false))
              or (kernel_installed.changed | default(false))) }}
  become: yes
  roles:
    - {role: apt-proxy, tags: always}   # roles run before tasks; everything below uses apt
  tasks:
    - name: update-pciids
      command: update-pciids

    - name: update-smart-drive-db
      command: update-smart-drivedb

    # - name: For overriding user check
    #   ansible.builtin.shell: |
    #     echo 0
    #   register: logged_in_users_count
    #   changed_when: false  # This task never changes system state

    # See group_vars/all/maintenance.yml for why this is not `who`.
    - name: Get logged-in users (excluding Ansible executor) count
      ansible.builtin.shell: '{{ logged_in_users_command }}'
      register: logged_in_users_count
      changed_when: false  # This task never changes system state
      check_mode: false    # read-only, and every when: below depends on it

    # See group_vars/all/maintenance.yml -- do not simplify to `pgrep slurmstepd`.
    - name: Count running slurm job steps
      ansible.builtin.shell: '{{ slurm_jobs_command }}'
      register: slurm_jobs_count
      changed_when: false  # This task never changes system state
      check_mode: false    # read-only, and the reboot gate depends on it

    - name: update apt-get cache
      apt: update_cache=yes

    - name: Unhold packages
      command: apt-mark unhold {{ held_package_patterns | map('quote') | join(' ') }}
      register: unhold_result
      changed_when: unhold_result.stdout_lines | reject('search', 'was already') | list | length > 0
      when:
        - not (logged_in_users_count.stdout | int > 0)

    - name: Remove nvidia and kernel
      command: >
        apt-get --autoremove -y purge '*nvidia*'
      when:
        - not (logged_in_users_count.stdout | int > 0)

    - name: Install or upgrade kernels
      ansible.builtin.apt:
        state: latest
        allow_change_held_packages: true
        pkg:
          - linux-zabbly
      register: kernel_installed
      when:
        - not (logged_in_users_count.stdout | int > 0)

    - name: Check if nvidia-driver is needed
      ansible.builtin.shell: |
        ubuntu-drivers list | cut -d, -f1 | grep -v server | sort -V | tail -1 | grep nvidia-driver
      ignore_errors: true
      register: nvidia_driver_needed
      changed_when: false  # This task never changes system state

    - name: Install or upgrade nvidia driver
      ansible.builtin.apt:
        name:  "{{ nvidia_driver_needed.stdout }}"
        state: latest
        allow_change_held_packages: true
      register: nvidia_installed
      when:
        - nvidia_driver_needed.rc == 0
        - not (logged_in_users_count.stdout | int > 0)

    - name: Rebuild all dkms packages
      ansible.builtin.shell: |
        ls /boot/initrd.img-* | cut -d- -f2- | xargs -n1 /usr/lib/dkms/dkms_autoinstaller start
      when:
        - nvidia_driver_needed.rc == 0
        - (nvidia_installed.changed | default(false)) or (kernel_installed.changed | default(false))

    # Guarded like the rest: if the host was busy we never unheld anything, so
    # there is nothing to re-hold. Running it unconditionally also meant a bare
    # command: reporting changed on every play.
    - name: Hold kernel and nvidia
      command: apt-mark hold {{ held_package_patterns | map('quote') | join(' ') }}
      register: hold_result
      changed_when: hold_result.stdout_lines | reject('search', 'was already') | list | length > 0
      when:
        - not (logged_in_users_count.stdout | int > 0)

    - name: setuid bit on /sbin/unix_chkpwd
      ansible.builtin.file:
        path: /sbin/unix_chkpwd
        mode: 'u+s'
        state: file

    - name: safe-upgrade
      apt: upgrade=safe cache_valid_time=3600 autoclean=yes autoremove=yes

    - name: full-upgrade
      apt: upgrade=full cache_valid_time=3600 autoclean=yes autoremove=yes

    - name: purge old configs
      ansible.builtin.shell: |
        dpkg -l | grep '^rc' | awk '{print $2}' | xargs --no-run-if-empty dpkg --purge
      ignore_errors: yes

    - name: Reboot if changes
      reboot:
        reboot_timeout: 300
      when: reboot_pending | bool
