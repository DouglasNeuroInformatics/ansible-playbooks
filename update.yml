---
- hosts:
  - workstations
  - computenodes
  vars_files:
    - vars/kernel-nvidia.yml
  vars:
    # The reboot gate, named so the firmware update cannot drift from it. fwupd
    # stages most payloads for the bootloader to apply on the next boot, so it
    # is only worth running when that boot is actually going to happen. Lazily
    # evaluated, so it is only valid after the registers below have all run.
    # Gated on host_idle, not maintenance_window, so force_maintenance alone
    # never reboots a busy host; see group_vars/all/maintenance.yml.
    reboot_pending: >-
      {{ ((force_reboot | default(false) | bool) or (host_idle | bool))
         and ((nvidia_installed.changed | default(false))
              or (kernel_installed.changed | default(false))) }}
  become: yes
  roles:
    - {role: apt-proxy, tags: always}   # roles run before tasks; everything below uses apt
  tasks:
    - name: update-pciids
      command: update-pciids

    - name: update-smart-drive-db
      command: update-smart-drivedb

    # See group_vars/all/maintenance.yml for why this is not `who`.
    - name: Get logged-in users (excluding Ansible executor) count
      ansible.builtin.shell: '{{ logged_in_users_command }}'
      register: logged_in_users_count
      changed_when: false  # This task never changes system state
      check_mode: false    # read-only, and every when: below depends on it

    # See group_vars/all/maintenance.yml -- do not simplify to `pgrep slurmstepd`.
    - name: Count running slurm job steps
      ansible.builtin.shell: '{{ slurm_jobs_command }}'
      register: slurm_jobs_count
      changed_when: false  # This task never changes system state
      check_mode: false    # read-only, and the reboot gate depends on it

    - name: update apt-get cache
      apt: update_cache=yes

    # Held packages are released only inside the maintenance window, and the
    # hold in always: has no gate: it puts the holds back when a step fails,
    # and on a busy host it restores holds an earlier run left released. A
    # failure still stops the host here, before the upgrades and the reboot.
    - name: Kernel and nvidia maintenance
      block:
        - name: Kernel and nvidia in the maintenance window
          when: maintenance_window | bool
          block:
            - ansible.builtin.import_role:
                name: common
                tasks_from: apt-hold
              vars:
                apt_hold_action: unhold

            - name: Install or upgrade kernels
              ansible.builtin.apt:
                state: latest
                pkg:
                  - linux-zabbly
              register: kernel_installed

            # The same steps site.yml runs; see the file.
            - ansible.builtin.import_role:
                name: workstation
                tasks_from: nvidia-driver
              vars:
                nvidia_driver_state: latest
              when: "'workstations' in group_names"
      always:
        - ansible.builtin.import_role:
            name: common
            tasks_from: apt-hold
          vars:
            apt_hold_action: hold

    - name: setuid bit on /sbin/unix_chkpwd
      ansible.builtin.file:
        path: /sbin/unix_chkpwd
        mode: 'u+s'
        state: file

    - name: safe-upgrade
      apt: upgrade=safe cache_valid_time=3600 autoclean=yes autoremove=yes

    - name: full-upgrade
      apt: upgrade=full cache_valid_time=3600 autoclean=yes autoremove=yes

    - name: purge old configs
      ansible.builtin.shell: |
        dpkg -l | grep '^rc' | awk '{print $2}' | xargs --no-run-if-empty dpkg --purge
      ignore_errors: yes

    # fwupd is not everywhere -- the compute nodes have no 85-fwupd because they
    # have no fwupd -- and this is not the play to start installing it.
    - name: Check for fwupdmgr
      ansible.builtin.stat:
        path: /usr/bin/fwupdmgr
      register: fwupdmgr_binary
      changed_when: false  # This task never changes system state
      when: reboot_pending | bool

    # --force because a refresh inside the metadata's cache window exits
    # non-zero, and non-fatal because LVFS being unreachable is not a reason to
    # abandon a reboot the host has already earned.
    - name: Refresh firmware metadata
      ansible.builtin.command: fwupdmgr refresh --force
      register: fwupd_refresh
      changed_when: false  # Only touches the local metadata cache
      failed_when: false
      when:
        - reboot_pending | bool
        - fwupdmgr_binary.stat.exists | default(false)

    # rc 2 is fwupd's "nothing to do", not a failure. --no-reboot-check stops
    # fwupdmgr from taking the reboot into its own hands; the task below owns
    # that, and it honours the slurm and logged-in-user gates.
    - name: Stage firmware updates
      ansible.builtin.command: fwupdmgr update --assume-yes --no-reboot-check
      register: fwupd_update
      changed_when: fwupd_update.rc == 0
      failed_when: fwupd_update.rc not in [0, 2]
      when:
        - reboot_pending | bool
        - fwupdmgr_binary.stat.exists | default(false)

    - name: Reboot if changes
      reboot:
        reboot_timeout: 300
      when: reboot_pending | bool
